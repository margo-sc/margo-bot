  - title: "Жиры"
    items: [avocado, nuts, olive_oil, peanut_butter]

treat_buttons: [pp_desserts, chocolate, cookies, ice_cream, candies, chips]

# Наборы для «любимого»: одна кнопка — несколько продуктов, бот чередует их по дням
treat_sets:
  pp_desserts:
    title: "🍰 ПП-десерты Марго"
    items: [pp_candies, pp_roll, pp_medovik, pp_choco_madness, pp_tiramisu, pp_banana_cake, pp_carrot_cake, pp_protein_cake, pp_pan_cake, pp_protein_dessert]

# Что убирают исключения (Шаг 4.3)
exclusions:
  lactose: {title: "Без лактозы", cats: [milk, yogurt, kefir, cheese, cottage, soft_cheese], products: [ice_cream, sour_cream, pizza, cake, pp_roll, pp_protein_cake, pp_choco_madness, pp_medovik, pp_pan_cake, pp_tiramisu, pp_carrot_cake, pp_protein_dessert]}
  gluten:  {title: "Без глютена", cats: [pasta, bread, lavash, oats, crispbread], products: [bulgur, couscous, cookies, waffles, pizza, cake, pp_candies, pp_medovik, pp_pan_cake, pp_tiramisu, pp_carrot_cake, pp_protein_dessert, pp_banana_cake]}
  no_meat: {title: "Не ем мясо", cats: [poultry, meat, ham], products: []}
  no_fish: {title: "Не ем рыбу", cats: [fish, seafood, salted_fish, canned_fish, surimi], products: []}

# Масло для готовки есть почти у всех: если девушка его не отметила, бот всё равно его использует
pantry: [olive_oil, onion, tomato_paste, soy_sauce]

# Доли калорий по приёмам пищи (после «любимого»)
meal_plans:
  "3":   {breakfast: 0.30, lunch: 0.40, dinner: 0.30}
  "3+1": {breakfast: 0.25, lunch: 0.35, snack: 0.15, dinner: 0.25}
  "4-5": {breakfast: 0.25, snack1: 0.10, lunch: 0.30, snack: 0.10, dinner: 0.25}

# ---------------------------------------------------------------------
#  БЛЮДА
#  meal: breakfast / lunch / dinner / snack
#  quick: true — готовится до 15 минут (для «почти не готовлю»)
#  batch: true — хорошо хранится 2–3 дня (для «готовлю заранее»)
#  src: margo — рецепт из книг Маргариты; how — коротко, как готовить (показывается в меню)
#  alt — запасное название, если основной продукт заменён (slots — номера строк items, с нуля)
#  add: true — продукт добавлен сверх рецепта (хлеб, салат). «Как готовить» показывается,
#             только если все остальные продукты — именно из рецепта
#  items: pick — подходящие продукты (ключи) или категории (@категория)
#         g — обычная порция, min/max — в каких пределах бот может менять граммы
#         opt: true — если такого продукта у девушки нет, блюдо всё равно подходит
# ---------------------------------------------------------------------
