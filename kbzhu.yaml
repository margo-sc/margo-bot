# =====================================================================
#  РАСЧЁТ НОРМЫ КБЖУ И МЕНЮ НА 7 ДНЕЙ — ТЕКСТЫ И НАСТРОЙКИ
#  Править так же, как content.yaml: сохранить и написать боту /reload.
#  Продукты, КБЖУ и блюда — в файле kbzhu_food.yaml.
#  Подстановки: {first_name} / {name} — имя девушки, остальные — в описании у текста.
# =====================================================================

enabled: true

# Первая строка главного меню бота
start_button: ["🔸 Узнать свою норму КБЖУ и меню на 7 дней", "kbzhu:start"]

# Ссылки для Instagram и канала: t.me/margo_sale_bot?start=insta_kbzhu
deeplinks:
  insta_kbzhu: {source: insta, open: "kbzhu:start"}
  insta_kbzhu_stories: {source: insta_stories, open: "kbzhu:start"}
  tg_kbzhu: {source: tg_channel, open: "kbzhu:start"}
  insta_recepty: {source: insta, open: "kbzhu:start"}
  book_recepty: {source: book, open: "kbzhu:start"}

# Уведомлять тебя о каждой девушке, которая получила норму
notify_each: true

# Скидка для тех, кто получил меню. Для консультации бот сам создаёт товар со скидкой,
# для ведения — пишет тебе, что действует скидка (счёт ты выставляешь сама командой /schet).
discount:
  percent: 15
  hours: 72
  products: [konsult, vedenie]

policy_url: "https://rita-fitt.ru/privacy.html"

texts:
  intro: |
    Привет! Я бот Маргариты Тютюнник — нутрициолога и тренера @senorita_fitness 💛

    За 2 минуты я посчитаю твою личную норму калорий, белков, жиров и углеводов. А потом соберу тестовое меню на 7 дней — из продуктов, которые ты любишь. Да, шоколадка тоже может там быть 🍫

    Никаких «нельзя» и войны с едой. Только понятные цифры под тебя.

    🎁 А вместе с меню подарю 4 книги моих рецептов: завтраки, обеды, ужины и перекусы — 56 блюд с КБЖУ и пошаговым приготовлением.
  consent: |
    Перед началом: я задам пару вопросов о весе и здоровье. Эти данные нужны только для расчёта и хранятся в защищённом виде.

    Нажимая «Согласна», ты даёшь ИП Тютюнник Маргарите Вениаминовне согласие на обработку персональных данных, включая сведения о состоянии здоровья, для расчёта нормы питания и составления меню. Подробнее — в <a href="{policy_url}">политике обработки данных</a>.
  consent_yes: "Согласна, поехали!"
  consent_policy: "Политика обработки данных"

  already: |
    {name}, твоя норма уже посчитана 🙂 Что сделать?

  ask_name: "Как тебя зовут?"
  ask_age: "{name}, сколько тебе полных лет?"
  bad_number: "Напиши, пожалуйста, просто число, например {example}"
  bad_age: "Проверь, пожалуйста, возраст — напиши число от 18 до 75."
  ask_preg: "Ты сейчас беременна или кормишь грудью?"
  ask_height: "Твой рост в сантиметрах? Например: 165"
  bad_height: "Проверь, пожалуйста, рост — нужно число от 140 до 200 см."
  ask_weight: "Твой текущий вес в килограммах? Можно с десятыми: 62,5"
  bad_weight: "Проверь, пожалуйста, вес — нужно число от 35 до 200 кг."
  ask_activity: |
    Какой у тебя обычный день? Выбери то, что ближе всего:

    🛋 <b>Минимальная</b> — сидячая работа, тренировок нет, меньше 5 000 шагов
    🚶‍♀️ <b>Лёгкая</b> — 1–2 тренировки в неделю или 5–8 тысяч шагов
    🏃‍♀️ <b>Средняя</b> — 3–4 тренировки в неделю или 8–12 тысяч шагов
    🔥 <b>Высокая</b> — 5+ тренировок или работа на ногах весь день
  ask_food: "И ещё один важный вопрос. Как у тебя сейчас с едой?"
  ask_goal: "Какая у тебя цель?"
  use_buttons: "Выбери, пожалуйста, вариант на кнопках выше 🙂"

  minor: |
    Спасибо, что честно ответила 💛

    В твоём возрасте организм ещё растёт, поэтому считать калории по общей формуле и худеть по ней нельзя — это может навредить.

    Если тебя беспокоит вес или питание, лучше обсудить это с родителями и врачом.
  pregnant: |
    Поздравляю! 🤍

    Во время беременности и кормления дефицит калорий давать нельзя, а нормы питания сильно отличаются от обычных. Поэтому стандартный расчёт я делать не буду — он может навредить.

    Я работаю с питанием беременных и кормящих лично. Приходи на консультацию — разберём твою ситуацию.
  low_bmi: |
    {name}, по твоим параметрам вес уже ниже нормы, поэтому дефицит я считать не буду — это вредно для гормонов и здоровья.

    Могу посчитать норму для поддержания и помочь укрепить тело — так фигура меняется, а здоровье не страдает.

  # {kcal} {protein} {fat} {carbs} {treat}
  result: |
    {name}, готово! Вот твоя норма на каждый день 👇

    🔸 Калории: <b>{kcal} ккал</b>
    🥩 Белки: <b>{protein} г</b>
    🥑 Жиры: <b>{fat} г</b>
    🍞 Углеводы: <b>{carbs} г</b>
    🍫 Из них на любимое: до <b>{treat} ккал</b>
  result_lose: |
    Это значит, что ты можешь снижать вес спокойно — без голода и без отказа от того, что любишь. Примерно 0,5–1 кг в неделю — здоровый темп, а не «минус 5 за неделю», после которого всё возвращается.
  result_keep: |
    Эта норма поможет держать вес и при этом менять тело: меньше жира, больше тонуса. Главное — добирать белок.
  result_gain: |
    Эта норма поможет набирать спокойно и качественно — мышцы, а не только жир. Главное — добирать белок и тренироваться.
  floor_note: |
    Я поставила тебе минимум {kcal} ккал. Меньше есть не стоит: при сильном дефиците тело начинает экономить энергию, и похудение останавливается.
  fear_note: |
    Спасибо, что поделилась. Это важно 🤍

    Я посчитала тебе мягкий дефицит — без жёстких урезаний. Пожалуйста, не ешь меньше этой нормы: так тело быстрее приходит в баланс.

    Тебе не нужно справляться с этим одной. Если тяжело уже давно, приходи ко мне на личное ведение. Я психолог пищевого поведения, и мы с тобой сможем с этим поработать.
  binge_note: |
    Про срывы и переедания: дело не в силе воли. Почему жёсткие ограничения заканчиваются срывом и как выйти из этого круга — в моей книге «Я снова сорвалась» 🤍
  diets_note: |
    Чтобы выйти из круга диет, важно понимать, как работает питание, и уметь выстраивать его самой. Этому я учу в учебнике «Сам себе нутрициолог» 🤍
  offer_menu: "Хочешь, я соберу тебе тестовое меню на 7 дней под эту норму? Из твоих продуктов, с граммовками."
  norm_only: |
    Хорошо 🙂 Норма останется здесь — её всегда можно найти в меню бота. Если захочешь меню, просто нажми кнопку.

  ask_products: |
    Отметь продукты, которые ты обычно ешь или готова есть. Можно выбрать сколько угодно, потом нажми «Дальше».

    <b>{group}</b> ({step} из {total})
  ask_own: "Напиши продукт (или несколько через запятую) — я найду его в базе 🙂"
  own_found: "Добавила: {items} ✅"
  own_unknown: "Пока не знаю: {items}. Записала — Маргарита добавит в базу. А пока выбери из кнопок 🙂"
  own_more: "Можешь вписать ещё или нажми «Дальше»."
  ask_treats: |
    А теперь самое приятное 😊 Что ты любишь и не хочешь убирать из жизни?

    Шоколад, печенье, мороженое — отметь всё, что хочешь видеть в меню.
  ask_treat_own: "Напиши, что ты любишь 🙂 Например: пирожное, зефир, пицца"
  treat_similar: "«{word}» — на что это больше похоже? Так я точнее посчитаю порцию."
  ask_excl: "Есть что-то, что ты не ешь совсем?"
  ask_excl_own: "Напиши, что ты не ешь (можно несколько через запятую)."
  excl_found: "Уберу из меню: {items} ✅"
  excl_unknown: "Такого продукта нет в моей базе, значит, в меню его и так не будет 🙂"
  ask_meals: "Сколько раз в день тебе удобно есть?"
  ask_cooking: "И как у тебя с готовкой?"
  few_products: "Отметь, пожалуйста, хотя бы несколько продуктов белка и гарниров — иначе меню не собрать 🙂"
  building: "Собираю твоё меню… ⏳"
  meals_bumped: "Твою норму в 3 приёма пищи не уместить без огромных порций, поэтому я добавила перекус — так будет легче и комфортнее 🙂"
  relaxed: "Из отмеченных продуктов не получилось собрать все приёмы пищи, поэтому я добавила пару базовых продуктов. Если что-то не подходит — нажми «Пересчитать» и отметь побольше продуктов 🙂"
  menu_done: |
    Это твоё меню на 7 дней 💛

    Попробуй пожить с ним и посмотри, как ты себя чувствуешь: сытость, энергия, настроение.

    Завтра вечером я спрошу, как прошёл первый день.

  # «Хочу ведение» в течение скидки. {deadline} — до какого числа действует скидка
  vedenie_discount: |
    Как здорово 🤍 Напиши мне в личные сообщения — обсудим твою цель, формат работы и договоримся о старте. Скидка {discount}% за тобой до {deadline}.

    Кнопка ниже откроет чат со мной, сообщение уже будет набрано — просто отправь его.
  vedenie_prefill: "Привет! Я прошла расчёт КБЖУ в боте и хочу в личное ведение со скидкой 🤍"

  # ответы на «Как прошёл первый день?»
  fb_ok: "Супер! Продолжай — и обрати внимание на энергию к вечеру 💛"
  fb_hungry: |
    Спасибо, что честно написала. Попробуй добавить овощей и воды, а белок сдвинуть на ужин.

    Если голод держится — это сигнал, что меню нужно подстроить под тебя. Это как раз то, что я делаю лично.
  fb_much: "Это частая реакция после диет — организм отвык от нормальной еды. Не урезай, дай телу 3–4 дня привыкнуть 💛"
  fb_notstarted: "Ничего страшного, начать можно с завтрака. Без идеального понедельника 💛"

  # «Посмотреть отзывы». Скриншоты загружаются командой: фото с подписью /otzyv
  reviews: |
    Вот что пишут девушки, с которыми я работала лично 👇

    «У Риты нет одного подхода ко всем: она очень тонко чувствует каждого человека и понимает, какой „пинок“ сработает именно сейчас. Благодаря ей я искренне полюбила спорт, научилась спокойно относиться к еде и перестала жить в постоянном страхе». — <i>Ольга</i>

    «Изменилось очень многое! В первую очередь поменялся мой образ жизни в целом: я стала отслеживать белки, углеводы и полезные жиры, свою активность. И самое главное — я наладила сон!» — <i>Александра</i>

  deleted: "Готово, твои данные удалены 🤍 Если захочешь посчитать норму снова — нажми кнопку в меню."
  expired: "Давай начнём сначала 🙂"

