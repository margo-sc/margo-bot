# Сообщения после меню. day — через сколько дней после получения меню, time — во сколько (по Москве)
follow:
  - day: 1
    time: "19:00"
    text: "{first_name}, как прошёл первый день по меню? 🙂"
    buttons:
      - ["Всё отлично", "kbzhu:fb:ok"]
      - ["Было голодно", "kbzhu:fb:hungry"]
      - ["Было слишком много еды", "kbzhu:fb:much"]
      - ["Не получилось начать", "kbzhu:fb:notstarted"]
  - day: 2
    time: "12:00"
    text: |
      {first_name}, уже попробовала что-нибудь из книг рецептов? 🙂

      Напиши мне прямо сюда, какое блюдо понравилось больше всего, — мне правда интересно 💛
  # На 3-й день — личная работа со скидкой. С этого сообщения начинается скидка (discount.hours часов).
  # Подстановки: {discount} {hours} {vedenie_old} {vedenie_new} {konsult_old} {konsult_new}
  - day: 3
    time: "12:00"
    starts_discount: true
    text: |
      {first_name}, уже третий день по меню 🙂 Как ощущения: сытость, энергия, настроение?

      Важно, чтобы ты понимала разницу 👇 Бот считает по формуле. Он не знает твой график, не видит, где ты срываешься, не учитывает цикл, тренировки, сон и стресс.

      Когда питание составляю я лично, я разбираю всё это и подстраиваю питание под твою реальную жизнь, а не под «идеальный день». Поэтому оно работает долго, а не две недели.

      🎁 Только для тех, кто прошёл расчёт: скидка {discount}% в течение {hours} часов.
      Личное ведение — <b>{vedenie_new} ₽</b> вместо {vedenie_old} ₽ в месяц
      Консультация — <b>{konsult_new} ₽</b> вместо {konsult_old} ₽
    buttons:
      - ["🤍 Личное ведение — со скидкой", "kbzhu:buy:vedenie"]
      - ["💬 Консультация — {konsult_new} ₽", "kbzhu:buy:konsult"]
      - ["Все программы Маргариты", "screen:catalog"]
  - day: 7
    time: "12:00"
    text: |
      Неделя прошла, тестовое меню закончилось 🌿 Самое сложное — не начать, а не бросить через неделю.

      Вот что пишут девушки, с которыми я работала лично 👇

      «Самое главное — изменилось моё отношение к еде. Я больше не живу по правилам: проголодалась в девять вечера — поем, не голодная — спокойно пропущу ужин. Я ем и сладкое, и солёное и больше не испытываю из-за этого чувства вины». — <i>Ольга</i>

      «У меня были истерики из-за того, что вес стоял. Я записывала тебе видео со слезами, а ты просто говорила: „Саш, продолжай“. Так и получилось. Я стала просыпаться без отёков, и у меня перестало всё время хотеться закинуть что-то сладкое в живот». — <i>Александра</i>

      Бот может посчитать цифры. А вот поддержать, когда вес стоит и хочется всё бросить, — это уже моя работа 💛
    buttons:
      - ["Хочу ведение", "kbzhu:buy:vedenie"]
      - ["Посмотреть отзывы", "kbzhu:reviews"]
  - day: 14
    time: "12:00"
    text: |
      Последнее сообщение от меня, обещаю 🙂

      Если ты пока не готова к личной работе — книга «Я снова сорвалась» поможет перестать воевать с едой, а учебник «Сам себе нутрициолог» — научиться самой выстраивать питание.
    buttons:
      - ["📖 Книга — 990 ₽", "product:kniga"]
      - ["📚 Учебник — 4 990 ₽", "product:uchebnik"]
      - ["Все программы Маргариты", "screen:catalog"]

